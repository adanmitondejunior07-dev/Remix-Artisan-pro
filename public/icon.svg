      <stop offset="0%" stopColor="#8EE061" />
      <stop offset="100%" stopColor="#7AC74F" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF9326" />
      <stop offset="100%" stopColor="#FF7A00" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF066" />
      <stop offset="100%" stopColor="#FFD60A" />
