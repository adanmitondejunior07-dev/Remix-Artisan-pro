    <path d="M16 104 L22 98 L28 104" />
    <path d="M92 104 L98 98 L104 104" />
  </g>

  <!-- Carte Afrique en Orange Vif #FF7A00 -->
  <path d="M48 24 C56 24, 66 26, 73 31 C77 34, 82 39, 83 45 C84 49, 81 52, 79 55 C77 58, 77 62, 75 66 C73 70, 69 77, 66 82 C63 88, 59 94, 57 96 C55 94, 53 88, 51 83 C48 76, 45 73, 42 69 C39 65, 34 62, 33 57 C31 51, 33 46, 36 43 C39 40, 42 37, 43 33 C44 28, 45 24, 48 24 Z" fill="url(#orangeGrad)" stroke="#D96300" stroke-width="1.5" />

